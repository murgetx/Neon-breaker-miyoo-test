name: NEON BREAKER – Miyoo ARM build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/build-miyoo.yml'

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Run all native logic tests
        run: ./tools/run_tests.sh

  miyoo-arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y docker.io git wget tar
      - name: Download Miyoo toolchain
        run: |
          wget -O /tmp/mini_toolchain-v1.0.tar.gz https://github.com/steward-fu/website/releases/download/miyoo-mini/mini_toolchain-v1.0.tar.gz
          mkdir -p /tmp/miyoo-toolchain
          tar -xzf /tmp/mini_toolchain-v1.0.tar.gz -C /tmp/miyoo-toolchain
          test -d /tmp/miyoo-toolchain/mini
          test -d /tmp/miyoo-toolchain/prebuilt
      - name: Fetch Miyoo SDL2 port
        run: git clone --depth 1 https://github.com/steward-fu/sdl2.git /tmp/miyoo-sdl2
      - name: Build Miyoo SDL2 and graphics runtime
        run: |
          sudo docker build --platform linux/amd64 -t miyoo-sdl2 /tmp/miyoo-sdl2
          sudo docker run --rm --platform linux/amd64 \\
            -v /tmp/miyoo-sdl2:/work \\
            -v /tmp/miyoo-toolchain/mini:/opt/mini \\
            -v /tmp/miyoo-toolchain/prebuilt:/opt/prebuilt \\
            -w /work miyoo-sdl2 bash -lc '
              ln -sf /opt/prebuilt/arm-linux-gnueabihf/bin/ld.bfd /opt/prebuilt/arm-linux-gnueabihf/bin/ld
              ln -sf /opt/prebuilt/arm-linux-gnueabihf/bin/ld.bfd /opt/prebuilt/bin/arm-linux-gnueabihf-ld
              ln -sf /opt/prebuilt/arm-linux-gnueabihf/bin/ld.bfd /opt/prebuilt/bin/arm-linux-gnueabihf-ld.bfd
              export PATH=/opt/prebuilt/arm-linux-gnueabihf/bin:/opt/prebuilt/bin:/opt/mini/bin:$PATH
              make cfg && make gpu && make sdl2
            '
      - name: Cross-compile NEON BREAKER and package runtime
        run: |
          sudo docker run --rm --platform linux/amd64 \\
            -v "$GITHUB_WORKSPACE":/work/project \\
            -v /tmp/miyoo-sdl2:/work/sdl2 \\
            -v /tmp/miyoo-toolchain/mini:/opt/mini \\
            -v /tmp/miyoo-toolchain/prebuilt:/opt/prebuilt \\
            -w /work/project miyoo-sdl2 bash -lc '
              export SDL_ROOT=/work/sdl2
              ./tools/build_miyoo.sh
            '
      - name: Create OnionOS archive
        run: |
          cd dist/NEON_BREAKER
          zip -r "$GITHUB_WORKSPACE/NEON_BREAKER_Miyoo_OnionOS_ARM.zip" Roms
      - name: Upload ARM package
        uses: actions/upload-artifact@v4
        with:
          name: NEON_BREAKER_Miyoo_OnionOS_ARM
          path: NEON_BREAKER_Miyoo_OnionOS_ARM.zip
          if-no-files-found: error
